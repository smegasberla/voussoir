[package]
name = "voussoir-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test fixture: an app whose commands exist to prove the shell's guarantees"
# Real licence fields rather than a `deny.toml` exemption: two unpublished
# workspace crates are still ours, and an exemption list is a place a genuinely
# unlicensed dependency could hide.
license = "MIT"

[dependencies]
voussoir = { path = "../voussoir", features = ["storage", "rt"] }

[[bin]]
name = "voussoir-probe"
path = "src/main.rs"
