[package]
name = "scratch"
version = "0.1.0"
edition = "2021"

[dependencies]
# `full` turns on the native menu bar, file dialogs, update checks, and devtools
# in release builds. Remove `features` to get the minimal shell.
voussoir = { path = "../../../voussoir", features = ["full", "tray"] }

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
