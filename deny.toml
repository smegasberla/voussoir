# Dependency policy, enforced by `cargo deny check` in CI.
#
# The point is not that these crates are perfect. It is that a dependency cannot
# arrive with a licence nobody agreed to, or a known advisory, without CI saying
# so. Each entry below exists because the tree actually contains it: the allow
# list was produced from `cargo metadata` for the current lockfile rather than
# copied from a template, so a crate with an unexpected licence fails instead of
# being grandfathered in.

[graph]
# Only the crates a real build uses on this platform. Dev-only and platform-
# specific crates still matter, so every CI platform runs its own check.
all-features = true

[advisories]
# Do not fail on an advisory that does not affect the build graph: `cargo deny`
# already reasons about reachability, and ignoring unmaintained notices by default
# would train everyone to ignore the whole job.
#
# So each entry here is one advisory, one id, and one argument. A blanket ignore
# would be the thing this policy refuses.
ignore = [
  # `proc-macro-error` is unmaintained, not vulnerable: the advisory is
  # "maintainer unreachable", with no CVE and no exploit. It reaches the tree as
  # `glib-macros` -> `glib` -> `gtk` -> `tao`, so removing it means replacing the
  # GTK bindings, and no version of it exists that is maintained under the same
  # name. It is also a **proc-macro**, so it runs at build time on the machine
  # compiling the app and ships nothing to a user: the reachability argument is
  # that it is not in the artifact at all.
  #
  # Revisit when `gtk-rs` moves off it; the entry names one id so a *new*
  # advisory against the same crate still fails.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained, build-time proc-macro only, reached through gtk-rs" },
]

[licenses]
# Licences compatible with shipping under MIT. Anything not listed here is a
# deliberate decision to stop and look, not an oversight.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  # Reached through a RustCrypto dependency. Weak copyleft at file level: it
  # obliges changes to that crate's own files to be published, and nothing in
  # Voussoir modifies it. Keeping it is a recorded choice, not an accident.
  "MPL-2.0",
  # `webpki-roots` is the Mozilla CA bundle as source. It is data, not code, and
  # the licence is permissive; it arrives through `ureq` -> `rustls`, and the
  # alternative is disabling certificate verification, which is not an option.
  "CDLA-Permissive-2.0",
]

# No `exceptions` block on purpose: `baseline/` and `probe/` declare
# `license = "MIT"` in their own manifests. An exemption list is a place a real
# unlicensed dependency could hide, and these two are ours.

[bans]
# Exactly one crypto provider, and this is how that is enforced.
#
# The list holds the *alternatives*, not the one we use. `ring` arrives through
# `ureq` -> `rustls` and is the only provider in the tree, so banning it would
# have banned the thing the rule exists to protect: the entry said "ring" while
# the comment above it said "a second copy is the problem", and the file failed
# against its own dependency graph for as long as it existed. Naming what must
# never appear is the version of this rule that can actually be checked.
#
# Adding a second TLS stack is what this catches: `openssl` and `native-tls` are
# whole alternative stacks, and `aws-lc-rs` is rustls's *other* provider — pulling
# it in would put two crypto implementations in one binary, which is two places to
# be wrong.
deny = [
  { name = "openssl" },
  { name = "native-tls" },
  { name = "aws-lc-rs" },
  { name = "aws-lc-sys" },
]

[sources]
# Everything comes from crates.io. A dependency published from a git URL or a
# personal registry is how a build starts depending on something unfetchable.
unknown-registry = "deny"
unknown-git = "deny"
