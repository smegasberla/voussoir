[package]
name = "voussoir"
version = "0.2.0"
edition = "2021"
description = "Minimal Rust runtime shell: OS webview + tao window + generic JSON IPC"
license = "MIT"
authors = ["smegasberla <smegasberla@gmail.com>"]
repository = "https://github.com/smegasberla/voussoir"
homepage = "https://github.com/smegasberla/voussoir"
documentation = "https://github.com/smegasberla/voussoir/tree/master/docs/src"
readme = "../README.md"
keywords = ["gui", "desktop", "webview", "ipc", "tauri-alternative"]
categories = ["gui", "development-tools"]
exclude = ["examples/studio/icon.png"]

[dependencies]
# `linux-body` is not optional here: WebKitGTK only delivers POST bodies to a
# custom protocol handler when that feature is on, and the whole IPC bridge is
# a POST. Without it, invoke() silently receives an empty payload on Linux.
wry = { version = "0.57", features = ["linux-body"] }
# `dbus` (a default feature) is only used for Linux portal integrations and drag
# support. It needs libdbus headers on the build host, which cross-building for
# BSD does not have, and none of it is used by Voussoir: a window is created directly.
tao = { version = "0.37", default-features = false, features = ["rwh_06", "x11"] }
serde_json = "1"
# `derive` is what makes a typed command's argument and reply types a one-liner
# for the app author. `serde` is re-exported so an app crate needs only `voussoir`.
serde = { version = "1", features = ["derive"] }

# Dev-only crate. Never part of `full`: a release shell never enables the
# `hot-reload` feature, so this stays out of every shipped binary's tree.
libloading = { version = "0.8", optional = true }

# Opt-in crates. Each is behind a feature so a minimal app pays nothing.

# `rt` only: the multi-thread scheduler (work stealing, so one slow handler
# cannot starve the rest), time, and sync primitives. No `net`, no TLS: a
# command that needs sockets enables the feature on its own dependency.
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
futures-util = { version = "0.3", optional = true }

# GTK is Linux-only, and naming it directly is what lets the menu code describe a
# GTK container without guessing at an opaque type. It is not optional because
# cargo cannot enable a feature per target, and it is not gated behind a feature
# because it is *already* in tao's Linux tree: declaring it here dedupes to the
# same crate instance, so it adds no build time and no code to the binary.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
gtk = "0.18"

[features]
default = []
# Native menu bar with the platform's standard items (Cut/Copy/Paste/Quit).
menu = ["dep:muda"]
# System tray icon with a context menu.
tray = ["dep:tray-icon", "menu"]
# Native open/save file dialogs exposed as commands.
dialogs = ["dep:rfd"]
# Update checks, plus download/verify/install on desktop.
updater = ["dep:ureq", "dep:sha2", "dep:base64", "dep:ed25519-dalek"]
# Devtools in release builds (F12). Costs a little binary size.
devtools = ["wry/devtools"]
# Swap a hot-reloaded commands cdylib into the running shell (`voussoir dev`).
# Desktop-only in intent and in use: mobile platforms restrict dynamic code
# loading, and the mobile scaffold never enables this. Never part of `full`.
hot-reload = ["dep:libloading"]
# A real async runtime for `async_fn` commands. Off by default: it pulls in
# tokio's multi-thread scheduler and a timer wheel, which a synchronous app
# should not pay for. Independent of `full` on purpose.
rt = ["dep:tokio", "dep:futures-util"]
# A JSON-file key/value store in the platform data directory, exposed to the
# page as `storage.get|set|delete|keys|path`. Opt-in so the minimal shell keeps
# no filesystem story it does not need.
storage = []
# Everything a "real app" normally needs.
full = ["menu", "dialogs", "updater", "storage"]


[[example]]
name = "hello"
path = "examples/hello.rs"

# These four have no mobile backend: muda and rfd do not compile for Android or
# iOS at all, tray-icon has no mobile concept, and ureq pulls in `ring`, whose
# build script refuses to cross-build for Android without a C toolchain dance.
# Mobile gets native equivalents in `src/platform`, so gating them here is what
# lets one app declare the same features on every platform.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
muda = { version = "0.21", optional = true }
tray-icon = { version = "0.26", optional = true }
rfd = { version = "0.18", optional = true }
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
ed25519-dalek = { version = "2", optional = true, default-features = false, features = ["fast", "std", "zeroize"] }

# On Android those features are served by `src/platform`, which talks to the
# activity over JNI. `jni` is the binding itself; `ndk-context` is how the
# JavaVM and application context reach us, because tao stores them there.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
