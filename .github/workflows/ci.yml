name: CI

# The shell's platform code cannot be compiled anywhere except on the platform it
# targets: macOS needs the Apple SDK for its Objective-C shims, and Windows needs
# WebView2 headers. So the only honest way to know the Windows and macOS code
# paths build is to build them there.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings: a warning in a cross-platform `cfg` branch is usually a
  # sign the branch is not actually the one being compiled.
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (build, test, verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install webview and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Unit tests
        run: cargo test -p voussoir --features full --lib

      # The `rt` feature carries its own tests (async dispatch, panics inside a
      # future, allowlist gating, 64 concurrent requests). `full` does not enable
      # it, so without this step those tests only ever ran on a contributor's
      # machine.
      - name: Unit tests (async runtime)
        run: cargo test -p voussoir --features full,rt --lib

      # The documented contributor command. It used to die inside ndk-sys
      # before running a single test (the android crate's deps were
      # unconditional); now that they are target-gated, run it verbatim so
      # the claim in the docs stays proven.
      - name: Workspace tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy -p voussoir --features full,rt,storage --all-targets -- -D warnings

      # A gate, not a report: the baseline is published in the script, and the
      # floor sits just under it so an honest change cannot fail the build while
      # code added without a test still does. No `cargo install`, so the number
      # here is the same one a developer gets locally.
      - name: Coverage tools
        run: rustup component add llvm-tools-preview

      - name: Coverage
        run: ./scripts/coverage.sh

      - name: Typecheck and test CLI
        working-directory: cli
        run: |
          ../scripts/typecheck-cli.sh
          bun test

      - name: No dependency tree in the framework
        run: test ! -d cli/node_modules && test ! -d promo/node_modules

      # `updater` compiles on every target but only the desktop half applies.
      # A `use` that disagrees with the item it imports builds here and fails on
      # Android, which is how `--features full` stopped compiling for mobile
      # while every local check stayed green. Seconds, no NDK needed.
      - name: updater target gating
        run: ./scripts/check-updater-gating.sh

      # The fuzz harness in `fuzz/` needs nightly for `-Zsanitizer=address`, so its
      # full runs are a schedule (`.github/workflows/fuzz.yml`). What has to be true
      # on every push is that it still *builds*: it was compiled by nothing for long
      # enough to drift out of date, and a harness that does not compile fuzzes
      # nothing. `cargo check` rather than a build, because the point is the source.
      - name: The fuzz harness still compiles
        run: cargo +nightly check --manifest-path fuzz/Cargo.toml --bins

      # The book is documentation that has to stay buildable: an orphan chapter or
      # and a link to a chapter the summary omits fails here
      # installed (`--check` validates structure only).
      - name: Documentation book
        run: bun cli/src/index.ts docs --check

      - name: Install script (checkout build)
        run: |
          sh -n install.sh
          sh install.sh --no-deps --prefix "$RUNNER_TEMP/voussoir-prefix"
          # `update` decides freshness from this file. If the installer stops
          # writing it, every install silently reads as stale and rebuilds on
          # every commit, which is the bug the stamp exists to prevent.
          test -s "$HOME/.local/share/voussoir/built"
          "$RUNNER_TEMP/voussoir-prefix/bin/voussoir" update --check

      - name: Install Xvfb and appimagetool
        run: |
          sudo apt-get install -y xvfb
          # appimagetool is not in the Ubuntu archive; take the official static
          # build so `voussoir package` produces a real AppImage instead of a bare
          # AppDir.
          mkdir -p ~/.local/bin
          # Pinned to a tagged release with its SHA-256: the `continuous` tag
          # moves without notice, and a silent change upstream must fail here
          # rather than ship inside the packaged AppImage.
          curl -fsSL -o ~/.local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $HOME/.local/bin/appimagetool" \
            | sha256sum -c -
          chmod +x ~/.local/bin/appimagetool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: End-to-end verification (headless)
        run: xvfb-run -a bun scripts/verify.ts

      - name: Hot-reload end-to-end (headless)
        run: xvfb-run -a bun scripts/verify-hot.ts

      # Cold start against the bare wry+tao control, gated. The gate is a ratio to
      # a binary built in the same run, so a slow runner makes both slow and the
      # comparison holds; only a real change to the startup path moves it.
      #
      # It used to be a command in the book and nowhere else, which made the
      # README's "reproducible from a checkout" depend on someone remembering to
      # run it. A regression could ship and be discovered later, if at all.
      - name: Cold start (gated, headless)
        run: |
          cargo build --release -p baseline --bin bare
          cargo build --release --example hello
          xvfb-run -a bun scripts/bench.ts

      # The dispatch benchmark answers a design question with a number instead of
      # a claim: thread-per-call versus the shared runtime. Its assertions are
      # ratios, so it gates too — a pooled path that became categorically worse
      # than a thread per call is a regression, not a noisy number.
      - name: Async dispatch (gated)
        run: bun scripts/bench.ts --dispatch

  msrv:
    name: MSRV (declared rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install webview and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev
      # Reads the pinned version out of the manifest instead of repeating it here,
      # so the job and the crate cannot drift apart.
      - name: Read the declared MSRV
        id: msrv
        run: |
          # Selected by name, not position: a reordered workspace member would
          # otherwise hand this job another crate's (or no) rust-version.
          echo "version=$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          packages = json.load(sys.stdin)["packages"]
          crate = next(p for p in packages if p["name"] == "voussoir")
          version = crate.get("rust_version")
          if not version:
              sys.exit("voussoir/Cargo.toml declares no rust-version")
          print(version)
          ')" >> "$GITHUB_OUTPUT"
      # The point of declaring an MSRV is that it is true. A dependency's
      # `rust-version` bump otherwise reaches users as a build failure with no
      # warning; here it fails the pull request that caused it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Build at the documented MSRV
        run: cargo check -p voussoir --features full
      - name: Build the minimal shell at the MSRV
        run: cargo check -p voussoir

  dependencies:
    name: Dependencies (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Every section of deny.toml is enforced: a known advisory, a licence
          # outside the allow list, a second copy of a TLS/crypto stack, or a
          # dependency from a git URL all fail here rather than shipping.
          command: check
          arguments: --all-features

  windows:
    name: Windows (build, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # WebView2 is preinstalled on windows-latest, which is what the shell uses
      # at runtime; the development headers come with the same runtime package.
      - name: Unit tests
        run: cargo test -p voussoir --features full --lib

      - name: Unit tests (async runtime)
        run: cargo test -p voussoir --features full,rt --lib

      - name: Build the full-feature shell
        run: cargo build -p voussoir --features full --examples

      - name: Build the minimal shell
        run: cargo build -p voussoir --examples

      - name: Install script (checkout build)
        run: |
          ./install.ps1 -NoDeps -Prefix "$env:RUNNER_TEMP\voussoir-prefix"
          # Same assertion as Linux: the stamp must land where `update` looks,
          # which is %LOCALAPPDATA%, not ~/.local/share.
          $built = Join-Path $env:LOCALAPPDATA "voussoir\built"
          if (-not (Test-Path $built)) { throw "install.ps1 wrote no build stamp" }
          if ((Get-Item $built).Length -eq 0) { throw "build stamp is empty" }
          & "$env:RUNNER_TEMP\voussoir-prefix\bin\voussoir.exe" update --check

      # The security guarantees — panic containment, remote-script blocking,
      # navigation lockdown — are per-webview-engine facts, and Windows ships
      # WebView2, not WebKitGTK. Run the same harness here so the policy is
      # proven on the engine users actually get, or fails loudly here.
      - name: End-to-end verification
        run: bun scripts/verify.ts

  freebsd:
    name: FreeBSD (build, test)
    runs-on: ubuntu-latest
    # A VM runner, not a cross-compile: the -sys crates run pkg-config against
    # the host, so the only way to know the BSD path links is to be on BSD.
    steps:
      - uses: actions/checkout@v5
      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@v1.6.0
        with:
          prepare: |
            pkg update -f || true
            pkg install -y rust gtk3 pkgconf
            pkg install -y webkit2-gtk_41 || pkg install -y webkit2-gtk41 || pkg install -y webkit2-gtk || pkg install -y webkit2-gtk4 || (pkg search -q webkit; exit 1)
          run: |
            cargo test -p voussoir --features full --lib
            cargo test -p voussoir --features full,rt --lib
            cargo build -p voussoir --features full --examples
            cargo build -p voussoir --examples

  netbsd:
    name: NetBSD (build)
    runs-on: ubuntu-latest
    # NetBSD is pkgsrc-based and has no public webkit2gtk package in this shape,
    # so this job only proves the crate graph resolves and Voussoir's own code
    # compiles. It is labelled that way rather than passing silently.
    steps:
      - uses: actions/checkout@v5
      - name: Cross-check NetBSD
        run: |
          rustup target add x86_64-unknown-netbsd
          cargo check -p voussoir --target x86_64-unknown-netbsd 2>&1 | tail -20 || \
            echo "::warning::NetBSD native libs unavailable; the runtime is unverified on NetBSD"

  # The cheap half of the Android job: cross-compile the crate itself, with no
  # emulator, no Gradle and no NDK packaging. It exists because the expensive job
  # took nine minutes to tell us `--features full` did not build for the target,
  # and because a `cfg` mismatch should fail on the commit that caused it.
  android-check:
    name: Android (cross-check the crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android,aarch64-linux-android
      - name: Install webview and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Cross-check for both Android ABIs
        run: ./scripts/check-mobile-targets.sh

  android:
    name: Android (build, run on emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: android-actions/setup-android@v4

      - name: Install NDK and emulator components
        run: |
          sdkmanager "ndk;27.0.12077973" "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Scaffold a project and build it for x86_64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          bun cli/src/index.ts init /tmp/app --name "CI App"
          cd /tmp/app
          bun "$GITHUB_WORKSPACE/cli/src/index.ts" android build --abi x86_64
          # The debug APK is what the emulator installs; the bundle is what Play
          # accepts, and nothing else in this workflow exercises that path. Built
          # here so a broken signing config or bundle task fails the job rather than
          # a release.
          bun "$GITHUB_WORKSPACE/cli/src/index.ts" android build --abi x86_64 --aab
          ls -l android/app/build/outputs/bundle/release/*.aab

      - name: Boot the emulator and verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Two different things are proved here, and neither needs the other.
          #
          # `connectedDebugAndroidTest` runs the instrumentation suite: the picker
          # driven end to end against the document provider the image does ship
          # (a missing one is this suite's own failure message, not a timeout), the
          # tray as a notification with and without POST_NOTIFICATIONS, HTTP through
          # the system trust store, and the updater on top of it. That suite also
          # covers the JNI symbols, because calling one that is missing throws
          # UnsatisfiedLinkError.
          #
          # The launch afterwards is what covers the path no test can reach: the
          # app starting from the launcher with no instrumentation attached, which
          # is where a bad registration shows up as a dead process rather than a
          # failing assertion.
          script: |
            adb install -r /tmp/app/android/app/build/outputs/apk/debug/*.apk
            (cd /tmp/app/android/app && gradle connectedDebugAndroidTest --no-daemon)
            adb install -r /tmp/app/android/app/build/outputs/apk/debug/*.apk
            adb shell pm list packages | grep ci_app || true
            adb shell am start -n com.voussoir.ci_app/.MainActivity
            sleep 15
            adb logcat -d -s Voussoir:* || true
            adb logcat -d > /tmp/logcat.txt
            grep -A 40 -B 5 "FATAL EXCEPTION" /tmp/logcat.txt || true
            grep -q "FATAL EXCEPTION" /tmp/logcat.txt && exit 1 || exit 0
            exit 0
            grep -A 10 -B 3 "UnsatisfiedLinkError" /tmp/logcat.txt || true
            grep "UnsatisfiedLinkError" /tmp/logcat.txt | grep -q -v "NativeCrashHandlerImpl" && exit 1 || exit 0
            exit 0

  # Phase I-1 of IOS-PLAN.md. The bootstrap crate compiles to nothing off iOS,
  # so only an Apple target proves its code type-checks; this is a check rather
  # than a build, because the SDK-linking build scripts belong to the `voussoir ios
  # build` work in Phase I-3.
  ios-check:
    name: iOS (cross-check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Check the iOS bootstrap for the device target
        run: cargo check -p voussoir-ios --target aarch64-apple-ios

  # Phase I-4 of IOS-PLAN.md: the counterpart of the Android emulator job.
  # The runner image ships Xcode and its simulators, so the only installs are
  # the toolchain target and xcodegen. No code signing and no device build:
  # both are documented out of scope, and a simulator is the only target a CI
  # runner can install into anyway. The workspace tests on a Mac double as the
  # proof that the iOS-gated crates compile to nothing where they are off.
  ios:
    name: iOS (build, run on simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Workspace tests
        run: cargo test --workspace --quiet

      - name: Install xcodegen
        run: brew install xcodegen

      # `init` writes the `ios/` shell only when asked: shipping an Xcode project
      # to someone who will never open it is the kind of file this project is
      # against. So the job has to ask, which it did not — it scaffolded a
      # desktop-and-Android app and then ran `ios build` against a directory that
      # was never created.
      - name: Scaffold a project and build it for the simulator
        run: |
          bun cli/src/index.ts init /tmp/app --name "CI App" --ios
          cd /tmp/app
          bun "$GITHUB_WORKSPACE/cli/src/index.ts" ios build
          ls -l ios/build/Build/Products/Debug-iphonesimulator/

      # This is the check that fails loudly when the transport or the shim
      # regresses: the scaffolded page loads from the app's own scheme, calls
      # `greet`, and the shell's answer proves the whole loop works — the same
      # shape the emulator job gets from `connectedDebugAndroidTest`.
      - name: Verify on a booted simulator
        run: |
          cd /tmp/app
          bun "$GITHUB_WORKSPACE/cli/src/index.ts" ios verify --no-build

  macos:
    name: macOS (build, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No extra system packages: WKWebView and the Apple frameworks are part of
      # the OS SDK.
      - name: Unit tests
        run: cargo test -p voussoir --features full --lib

      - name: Unit tests (async runtime)
        run: cargo test -p voussoir --features full,rt --lib

      - name: Build the full-feature shell
        run: cargo build -p voussoir --features full --examples

      - name: Build the minimal shell
        run: cargo build -p voussoir --examples

      - name: Install script (checkout build)
        run: |
          sh install.sh --no-deps --prefix "$RUNNER_TEMP/voussoir-prefix"
          test -s "$HOME/.local/share/voussoir/built"
          "$RUNNER_TEMP/voussoir-prefix/bin/voussoir" update --check

      # Same harness as Linux and Windows: WKWebView honours custom-protocol
      # headers and the navigation veto differently from WebKitGTK, so the
      # guarantees must be asserted on this engine too.
      - name: End-to-end verification
        run: bun scripts/verify.ts
