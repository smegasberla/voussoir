name: Release

# Produces real installable artifacts per platform. Signing is left to secrets:
# when the secrets are absent the workflow still builds (so forks and PRs work)
# but clearly marks the artifact as unsigned instead of pretending.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install webview, gtk, and appimagetool deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev file
          # appimagetool is not packaged in the Ubuntu archive.
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x ~/.local/bin/appimagetool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Package the example app
        working-directory: examples/counter
        run: bun ../../cli/src/index.ts package --icon ../../voussoir/examples/studio/icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: examples/counter/dist-package/*.AppImage

  macos:
    runs-on: macos-latest
    # Secrets cannot be referenced from a step-level `if:`, so they are lifted to
    # job env and the steps test the env var instead.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Package the example app
        working-directory: examples/counter
        run: bun ../../cli/src/index.ts package
      - name: Sign (only when a certificate is configured)
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p actions build.keychain
          codesign --deep --force --options runtime --sign "Developer ID Application" \
            examples/counter/dist-package/*.app
      - name: Notarize (only when credentials are configured)
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent examples/counter/dist-package/*.app /tmp/app.zip
          xcrun notarytool submit /tmp/app.zip --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
          xcrun stapler staple examples/counter/dist-package/*.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: examples/counter/dist-package/*.app

  windows:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Package the example app
        working-directory: examples/counter
        shell: bash
        run: bun ../../cli/src/index.ts package
      - name: Sign (only when a certificate is configured)
        if: env.WINDOWS_CERTIFICATE != ''
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > cert.pfx
          "/c/Program Files (x86)/Windows Kits/10/bin/10.0.22621.0/x64/signtool.exe" \
            sign /fd SHA256 /f cert.pfx /p "$WINDOWS_CERTIFICATE_PASSWORD" \
            /tr http://timestamp.digicert.com /td SHA256 examples/counter/dist-package/windows/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: examples/counter/dist-package/*.zip

  # The CLI is one compiled binary, and `voussoir update` reads it from this
  # repository's `releases/latest`. Without these assets that endpoint answers
  # 404 and there is nothing to update to, however well the command is written.
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            name: voussoir-cli-linux-x86_64
          - os: ubuntu-latest
            target: bun-linux-arm64
            name: voussoir-cli-linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            name: voussoir-cli-macos-arm64
          - os: macos-latest
            target: bun-darwin-x64
            name: voussoir-cli-macos-x86_64
          - os: windows-latest
            target: bun-windows-x64
            name: voussoir-cli-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Compile the CLI
        shell: bash
        run: bun build --compile --target=${{ matrix.target }} cli/src/index.ts --outfile "${{ matrix.name }}"
      # Proves the binary is runnable and that its own updater agrees with the
      # version it was built from, before anything is published.
      - name: Smoke test the binary
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          chmod +x "${{ matrix.name }}"
          "./${{ matrix.name }}" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  publish:
    needs: [linux, macos, windows, cli]
    # A dispatch run has no tag, so it publishes nothing rather than inventing a
    # version the updater would then try to install.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect the CLI binaries and their checksums
        shell: bash
        run: |
          mkdir -p release
          # `download-artifact` nests each artifact in its own directory.
          find dist -type f -maxdepth 2 \( -name 'voussoir-cli-*' -o -name '*.AppImage' \
            -o -name '*.zip' \) -exec cp {} release/ \;
          cd release
          shasum -a 256 voussoir-cli-* > sha256sums.txt
          cat sha256sums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME" \
            --verify-tag || gh release upload "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --clobber
